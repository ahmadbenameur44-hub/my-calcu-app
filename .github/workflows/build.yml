name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-20.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git unzip zip libtool m4 automake autoconf libffi-dev python3-dev libltdl-dev libssl-dev

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip setuptools virtualenv wheel
          pip install "Cython==0.29.33" "buildozer==1.5.0"

      - name: Build APK with Buildozer
        run: |
          export DEBIAN_FRONTEND=noninteractive
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
