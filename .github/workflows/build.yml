name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zip unzip git libtool m4 automake openjdk-17-jdk autoconf libffi-dev python3-dev
          pip install --upgrade pip
          pip install "Cython==0.29.33" virtualenv buildozer

      - name: Build with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
